services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      # - "8000:8000" # Secure TLS port for remote control
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
volumes:
  portainer_data:
